name: Auto Commit README

on:
  schedule:
    # 02:00 UTC = 09:00 WIB, setiap hari. Cron GitHub Actions memakai UTC.
    - cron: "0 2 * * *"
  workflow_dispatch: {} # tombol "Run workflow" manual di tab Actions

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toggle spasi di README
        run: |
          node -e '
            const fs = require("fs");
            const p = "README.md";
            let c = fs.existsSync(p) ? fs.readFileSync(p, "utf-8") : "# peenjeee\n";
            if (/ \r?\n?$/.test(c)) {
              c = c.replace(/ +(\r?\n?)$/, "$1");
              console.log("Menghapus spasi kosong di akhir README.md");
            } else {
              c = c.replace(/(\r?\n?)$/, " $1");
              console.log("Menambah spasi kosong di akhir README.md");
            }
            fs.writeFileSync(p, c);
          '

      - name: Commit & push
        run: |
          git config user.name "peenjeee"
          git config user.email "gastwocls02@gmail.com"
          git add README.md
          git commit -m "Auto commit: Update README pada $(date -u '+%Y-%m-%d %H:%M UTC')" \
            || { echo "Tidak ada perubahan untuk di-commit."; exit 0; }
          git push
